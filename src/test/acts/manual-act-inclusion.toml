# Manual test act: recursive external-content inclusion.
# The included file is src/test/acts/shared/manual-guidance.md. Run:
# --act manual-act-inclusion
# Covers: >>> expansion in an Act instruction and prompt, preserving the
# included content at the marker location. The paths are intentionally raw.
# For nested-inclusion coverage, add another raw >>> path in the shared file,
# resolving that path relative to src/test/acts/shared/.
description = "Manual inclusion workflow for prompt content expansion."
instructions = '''
>>> src/test/acts/shared/manual-guidance.md
Use the included guidance when reviewing the selected context.
'''
inputs = '''
>>> src/test/acts/shared/manual-guidance.md
Summarize the included guidance and report the selected files.
Request: ${public.prompt}
'''

[default]
public.prompt = "Confirm that included content is available to the episode."

[gw]
path = "glob:src/test/acts"
interactive = false
threads = 1
