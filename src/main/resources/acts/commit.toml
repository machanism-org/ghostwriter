description = '''
This act automates the process of documenting and committing code changes in a project. 
It analyzes file modifications, groups them by change type, generates clear and concise 
commit messages that follow the project's historical style, and provides the exact git or 
svn commands needed to commit each group. The act ensures all actions are executed automatically, 
without prompting the user for confirmation, and outputs results in plain text for easy integration. 
'''

# basedOn:
#   - Specifies the configuration profile or template that this configuration is derived from.
#   - Useful for inheritance or extending base settings, allowing you to override or add to the base configuration as needed.
# basedOn = 

# =========================
# AI Agent Instructions
# =========================

# Multi-line string containing step-by-step instructions for the AI agent.
# Guides the agent on how to analyze code changes, generate commit messages,
# provide git commands, and format the output.
instructions = '''
You are a precise version-control agent. Automatically analyze, group, and execute git/svn commits in the current directory (`.`) using your command-execution tool.
'''

# =========================
# Inputs Section
# =========================

# Multi-line string describing the input workflow for the agent.
# Outlines the steps for checking the current directory status, grouping changes,
# and generating commit messages that match the project's historical style.
inputs = ['''
---
enabledTools:
  - CommandFunctionTools
  - CommandSpecFunctionTools
  - ProjectContextFunctionTools
---
Execute these steps strictly in order.

0. Detect the mode.
   - Run `git rev-parse --show-toplevel`. If it fails, call the `end_task` tool and output: "Not a git repository." Otherwise use the printed path as the root repository for all following steps.
   - Run `git -C <root> submodule status --recursive`.
   - If the output is empty, the mode is SINGLE (one plain repository, no submodules). If it is not empty, the mode is MULTI.
   - In SINGLE mode, ignore every step or sub-step that mentions submodules, pointers or parents; they do not apply. Everything else applies to the root repository exactly as written.

1. Discover repositories.
   - SINGLE mode: the list contains only the root.
   - MULTI mode: the list contains the root plus every submodule from the status output, ordered from the DEEPEST submodule up to the root (children always before their parent).

2. Check status per repository. For each repository in that order, run `git -C <repo> status --short` and `git -C <repo> diff --cached --name-only`.
   - If a repository already has staged files that you did not stage, do not commit it; report it as "skipped: pre-staged changes".
   - MULTI mode only: if a submodule is in detached HEAD (`git -C <repo> symbolic-ref -q HEAD` fails) and has changes, do not commit in it; report it as "skipped: detached HEAD" and also skip its parents' pointer update.
   - In SINGLE mode, a detached HEAD in the root does not block committing; just mention it in the report as a note.

3. Read history per repository. Run `git -C <repo> log -n 10 --pretty=%s` and follow that repository's own subject style (scope format, language, capitalization, length). If the repository has no commits yet, use the Conventional Commits style (type: subject, English, lowercase after the colon).

4. Analyze the changes in depth. Do this BEFORE grouping or writing any message. Never base a message on file names or `git status` output alone.
   a. For every modified or deleted file, run `git -C <repo> diff -- <file>` and read the actual hunks. For large diffs, read them in chunks (e.g. `git -C <repo> diff -U5 -- <file>`) rather than skipping them.
   b. For every untracked file, read its content (limit to the first ~200 lines for very large files and infer the rest from structure).
   c. MULTI mode only: for modified submodule pointers, run `git -C <repo> diff --submodule=log -- <submodule path>` to see which commits are included.
   d. If a changed function, class, config key or API is used elsewhere and the effect of the change is unclear, inspect the call sites (`git -C <repo> grep -n "<symbol>"`) to understand the real impact.
   e. For each change, determine:
      - WHAT changed: concrete functions, classes, endpoints, config options, UI elements, schemas, dependencies.
      - FUNCTIONAL EFFECT: how the behavior differs for the user, caller or system (new capability, fixed bug and its symptom, changed default, removed feature, performance or security effect, new validation, changed error handling, etc.).
      - WHY (only if evident from the code, comments, tests or naming; never invent motivation).
   f. Distinguish real functional changes from noise (formatting, renames, import reordering, comment edits). Mention noise only briefly and never present it as a functional change.
   g. Tests: if tests were added or changed, state which behavior they cover.

5. Group changes. Groups are built inside ONE repository only (never mix files from different repositories). Each group must be one logical, self-contained change (one feature, one fix, one refactor), based on the functional analysis from step 4, not on file location. Split unrelated changes inside a single file only if they can be separated by whole files; never use `git add -p` or other interactive commands. Choose the scope: feat, fix, docs, refactor, test, perf, build, chore, etc. In SINGLE mode all groups belong to the root repository.

6. Write commit messages. Every message consists of:
   - Subject (first line): active voice, present tense, max ~72 characters, in the repository's own style, naming the main functional result (e.g. "fix: prevent duplicate orders when payment callback is retried"), not the files touched.
   - Body (after exactly ONE blank line following the subject): 2-6 short lines or sentences that describe in detail WHAT was done and the functional effect, naming concrete components (functions, classes, endpoints, config keys). Explain the behavior before vs. after when it is a fix or a change. Mention side effects, breaking changes, new config or migration requirements if present.
   - Body layout: put each sentence on its own line, with NO empty lines between body lines. The only empty line in the whole message is the one between the subject and the body.
   - Forbidden: vague wording ("update code", "fix issues", "improve logic", "various changes", "minor tweaks"), listing file names as the description, claims not supported by the diff.
   - Trivial changes (typo, whitespace, version bump) may have a subject only.
   - Line breaks: NEVER write the two characters backslash+n ("\n") or any other escape sequence inside a commit message. Git and the shell do not interpret them, so they end up literally in the history.
   - Do NOT use several `-m` flags for the body: git inserts an empty line between every `-m`, which creates unwanted blank lines.
   - Pass the message through stdin with a quoted heredoc, so it contains real line breaks:
     git -C <repo> commit -F - <<'EOF'
     <subject>

     <body line 1>
     <body line 2>
     <body line 3>
     EOF
   - Write the heredoc lines without leading indentation. Only if no real bash shell is available (e.g. PowerShell), use `git -C <repo> commit -m "<subject>" -m "<entire body as ONE string with real line breaks>"`, still never with "\n".

7. Commit.
   SINGLE mode: for each group in the root repository, run `git -C <root> add -- <files of the group>` and then commit using the heredoc form from step 6. Do not stage anything outside the group. Continue to step 8 afterwards.
   MULTI mode, bottom-up, for each repository in the order from step 1:
   a. `git -C <repo> add -- <files of the group>` for each group, then commit using the heredoc form from step 6 (`git -C <repo> commit -F - <<'EOF' ... EOF`), with one blank line after the subject and no blank lines inside the body. Never use "\n" inside a message.
   b. After a submodule is committed, its parent now sees a changed pointer. In the parent, stage it with `git -C <parent> add -- <submodule path>` and include it in a dedicated group "chore: update <submodule> pointer" (or in the parent's own group if logically related). For pointer commits, the body must summarize the functional changes brought by the submodule commits (based on `git diff --submodule=log`). Never stage a submodule pointer before the commit inside the submodule is done.
   c. Never stage a submodule pointer if the submodule still has uncommitted changes (`git -C <sub> status --short` is not empty).

8. Verify.
   - SINGLE mode: run `git -C <root> status --short`. The output should be empty unless files were intentionally skipped; report any remaining change.
   - MULTI mode: run `git submodule status --recursive` (no line may start with `+`, which would mean the pointer is out of sync) and `git status --short` in the root. Report any remaining discrepancy.

9. If there are NO changes in any repository (in SINGLE mode: the root has no changes), call the `end_task` tool and output: "No changes detected."

10. Push the commit report to the global context variable: `REPORT`.

# Special User Instruction

${public.prompt}

# Output Format (Strictly Plain Text, No Markdown)
Do not use Markdown code blocks, bold, or list markers. Use exactly this format, with no extra empty lines inside a field:

Successfully executed the following commits:

Repository: [path or "root"]
Group: [Name]
Files: [List of files]
Message: [Subject]
Details: [Body of the commit message: detailed functional description of what was done, one sentence per line, using real line breaks, no empty lines between them, never the literal characters "\n"]

Skipped: [repository - reason]   (only if something was skipped)
Verification: [OK or description of mismatch]
'''
]

# =========================
# Ghostwriter (gw) Section
# =========================
# This section contains configuration options for the Ghostwriter (gw) component.
# - path: Specifies the directory pattern to scan for changes.
#            "glob:." means the current directory and all subdirectories will be included.
#            This is useful for tools that need to analyze or process files within the project structure.

[gw]
# Directory pattern to scan for changes. "glob:." means the current directory and all subdirectories.
interactive = true

[default]
gw.path = "glob:."
public.prompt = "No special instructions."

# =========================
# Functional Tool Command Section
# =========================

[ft.command]
# denylist:
#   - Multi-line string containing patterns, keywords, or file/command signatures to be excluded from processing by functional tools.
#   - Each entry in the denylist should be placed on a separate line.
#   - Lines starting with '#' are treated as comments and ignored.
#   - Entries can be of two types:
#       - REGEX: Regular expressions for matching complex patterns in commands or file path.
#       - KEYWORD: Exact keywords or command fragments to match and exclude.
#   - Common use cases include preventing execution of dangerous commands, excluding sensitive files, or blocking specific operations.
denylist = '''
${super.value}
REGEX: git\s+(reset|clean|checkout|rebase|submodule\s+(update|deinit))\b
REGEX: git\s+add\s+(-A|--all|\.)(\s|$)
REGEX: git\s+commit\s+.*(-a\b|--amend)
'''